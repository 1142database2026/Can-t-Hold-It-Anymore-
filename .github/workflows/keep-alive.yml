name: Supabase Keep Alive

on:
  schedule:
    # 每 37 分鐘執行一次
    - cron: '37 * * * *'
  workflow_dispatch: # 允許您在 GitHub 頁面上手動觸發測試

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send API Request to Supabase
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/service?limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"
